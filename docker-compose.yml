services:
  web:
    build: .
    image: porras-asadero:1.0
    container_name: porras-asadero
    restart: unless-stopped

    container_name: porras-asadero
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_data:/app/media

volumes:
  media_data:
  
  media_data:
  
  media_data:
