{% load static %}
<!DOCTYPE html>
<html lang="es" class="admin-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asadero Porras - Admin</title>
    <link rel="shortcut icon" href="{% static 'img/icon.png' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'img/icon.png' %}" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Crimson+Text:ital@0;1&family=Oswald:wght@300;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- styles.css AL FINAL: así tus colores/fondos personalizados (sidebar, offcanvas, etc.)
         tienen prioridad sobre los valores por defecto de Bootstrap cuando la especificidad es igual -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="admin-body-shell">

    <div class="d-flex flex-column flex-lg-row w-100 admin-shell">

        {% if request.user.is_authenticated %}
            {% include "partials/aside.html" %}
        {% endif %}

        <main class="flex-grow-1 d-flex flex-column admin-main">
            <section class="p-3 p-lg-5 flex-grow-1">
                {% block content %}
                {% endblock content %}
            </section>
            {% include "partials/footer.html" %}
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="{% static 'js/contacto.js' %}" defer></script>
</body>
</html>
