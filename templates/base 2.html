{% load static %}  
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asadero Porras - Admin</title>
    <link rel="shortcut icon" href="{% static 'img/icon.png' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'img/icon.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">   
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Crimson+Text:ital@0;1&family=Oswald:wght@300;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html, body {
            background-color: #F5ECD7 !important;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        @media(min-width: 992px) {
            html, body {
                height: 100vh;
                overflow: hidden;
            }
            main {
                height: 100vh;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body style="overflow-x: hidden; background-color: #F5ECD7;">

    <div class="d-flex flex-column flex-lg-row w-100" style="overflow-x: hidden; min-height: 100vh; background-color: #F5ECD7;">

        {% if request.user.is_authenticated %}
            {% include "partials/aside.html" %}
        {% endif %}

        <main class="flex-grow-1 d-flex flex-column" style="background: #F5ECD7; min-width: 0;">
            <section class="p-3 p-lg-5 flex-grow-1"> 
                {% block content %}
                {% endblock content %}
            </section> 
            {% include "partials/footer.html" %}
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="{% static 'js/contacto.js' %}" defer></script>
</body>
</html>
