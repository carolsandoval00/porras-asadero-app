{% load static %}
<style>
    /* Clase para resaltar el botón de la sección actual */
    .active-custom {
        background-color: #C0392B !important;
        color: #F5ECD7 !important;
    }
    /* Efecto hover opcional */
    .nav-link:hover {
        background-color: rgba(232, 101, 26, 0.1);
        color: #E8651A !important;
    }
</style>

<aside class="d-flex flex-column p-3 shadow" style="background-color: #1A1008; color: #F5ECD7; width: 260px; height: 100vh; position: sticky; top: 0;">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
       <img src="{% static 'img/logo.png' %}" alt="Porras Asadero" style="height: 150px;">
    </a>
    
    <hr style="border-color: #3a2a18;">
    
    <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
            <a href="{% url 'inicio_admin' %}" class="nav-link {% if request.resolver_match.url_name == 'inicio_admin' %}active-custom{% endif %}" style="color: #F5ECD7;">
                <i class="bi bi-speedometer2 me-2"></i>
                Panel de Control
            </a>
        </li>

        <li>
            <a href="{% url 'lista_personal' %}" class="nav-link {% if request.resolver_match.url_name == 'lista_personal' %}active-custom{% endif %}" style="color: #F5ECD7;">
                <i class="bi bi-people me-2"></i>
                Usuarios y Personal
            </a>
        </li>

        <li>
            <a href="/pedidos/" class="nav-link {% if request.resolver_match.namespace == 'pedidos' %}active-custom{% endif %}" style="color: #F5ECD7;">
                <i class="bi bi-journal-text me-2"></i>
                Pedidos
            </a>
        </li>

        <li>
            <a href="{% url 'pago:dashboard' %}" 
               class="nav-link {% if request.resolver_match.namespace == 'pago' %}active-custom{% endif %}" 
               style="color: #F5ECD7;">
                <i class="bi bi-credit-card me-2"></i>
                Gestión de Pagos
            </a>
        </li>

        <li>
            <a href="{% url 'reserva_inicio' %}" class="nav-link {% if request.resolver_match.url_name == 'reserva_inicio' %}active-custom{% endif %}" style="color: #F5ECD7;">
                <i class="bi bi-calendar-check me-2"></i>
                Reservas y Mesas
            </a>
        </li>
    </ul>

    <hr style="border-color: #3a2a18;">

    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" style="color: #F5ECD7;" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-5 me-2"></i>
            <strong>{{ user.username|default:"Admin" }}</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser">
            <li><a class="dropdown-item" href="{% url 'panel_perfil' %}">Mi Perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="{% url 'logout' %}">Cerrar Sesión</a></li>
        </ul>
    </div>
</aside>
