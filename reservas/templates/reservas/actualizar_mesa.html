{% extends "base2.html" %}
{% block content %}

<div class="container d-flex justify-content-center mt-5 mb-5">
    <div class="card shadow p-4" style="max-width: 500px; width: 100%;">
        <h2 class="text-center mb-4">Actualizar Mesa {{ mesa.numero_mesa }}</h2>

        {% if message %}
            <div class="alert alert-success">{{ message }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Capacidad</label>
                {{ form.capacidad }}
            </div>
            <div class="mb-3">
                <label class="form-label">Ubicación</label>
                {{ form.ubicacion }}
            </div>
            <div class="mb-3">
                <label class="form-label">Estado</label>
                {{ form.estado }}
            </div>

            <button type="submit" class="btn btn-dark w-100 mt-3">Actualizar</button>
        </form>
    </div>
</div>

{% endblock %}
