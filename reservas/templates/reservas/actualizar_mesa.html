{% extends "base 2.html" %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#D4A017;--gold-light:#F5ECD7;--gold-dark:#A07810;
    --bg:#F5ECD7;--bg2:#EDE3C8;--bg3:#E0D4B0;
    --text:#1A1008;--muted:#6B5A3E;--hint:#A09070;
    --border:#D4C4A0;--border2:#C0AD84;
    --red-bg:#FAE0DC;--red-t:#C0392B;
    --radius:8px;--radius-lg:12px;--radius-xl:16px;
  }
  body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg)}
  .mc-wrap{max-width:560px;margin:0 auto;padding:2rem 1.5rem}
  .mc-card{background:#FDF7EC;border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.35rem;margin-bottom:1rem}
  .mc-card-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .mc-form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
  .mc-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .mc-input,.mc-select{font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);width:100%;transition:border-color .15s,box-shadow .15s}
  .mc-input:focus,.mc-select:focus{outline:none;border-color:#C0392B;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
  .mc-btn{padding:9px 20px;font-size:13px;font-weight:500;border-radius:var(--radius);cursor:pointer;border:1px solid;transition:all .15s;font-family:'DM Sans',sans-serif}
  .mc-btn-primary{background:#C0392B;color:#F5ECD7;border-color:#C0392B}.mc-btn-primary:hover{background:#9B2D21}
  .mc-btn-secondary{background:transparent;color:var(--text);border-color:var(--border2)}.mc-btn-secondary:hover{background:var(--bg2)}
  .mc-btn-row{display:flex;gap:8px;margin-top:1.1rem;justify-content:flex-end}
  .mc-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
  .mc-badge-ok{background:#EAF3DE;color:#27500A}
  .mc-badge-warn{background:#FAEEDA;color:#8B4000}
  .mc-badge-danger{background:#FAE0DC;color:#C0392B}
  .mc-msg-ok{background:#EAF3DE;color:#27500A;padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:1rem}
  .mc-msg-err{background:#FAE0DC;color:#C0392B;padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:1rem}
</style>

<div style="padding:1.5rem 1.5rem 0;max-width:560px;margin:0 auto">
  <div style="background:#1A1008;color:#F5ECD7;padding:1.6rem 2rem;border-radius:12px;margin-bottom:1.5rem;display:flex;align-items:center;gap:16px;">
    <div>
      <h1 style="font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin:0 0 4px;color:#F5ECD7;">Actualizar Mesa</h1>
      <p style="font-size:13px;color:#A09070;margin:0;">Modifica los datos de la mesa seleccionada</p>
    </div>
  </div>
</div>

<div class="mc-wrap">

  {% if messages %}
    {% for msg in messages %}
      <div class="{% if msg.tags == 'error' %}mc-msg-err{% else %}mc-msg-ok{% endif %}">
        {{ msg }}
      </div>
    {% endfor %}
  {% endif %}

  <div class="mc-card">
    <div class="mc-card-title">Datos de la mesa</div>

    <div style="margin-bottom:14px;padding:11px 13px;background:var(--bg2);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--muted)">Mesa actual</span>
      <span style="font-weight:600;font-family:'Playfair Display',serif">Mesa {{ mesa.numero_mesa }}</span>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mc-form-group">
        <label class="mc-label">Capacidad (personas) *</label>
        <input type="number" class="mc-input" name="capacidad" value="{{ mesa.capacidad }}" min="1" max="30" required>
      </div>
      <div class="mc-form-group">
        <label class="mc-label">Ubicación</label>
        <select class="mc-select" name="ubicacion">
          <option value="Salón principal"   {% if mesa.ubicacion == "Salón principal"   %}selected{% endif %}>Salón principal</option>
          <option value="Salón secundario"  {% if mesa.ubicacion == "Salón secundario"  %}selected{% endif %}>Salón secundario</option>
        </select>
      </div>
      <div class="mc-form-group">
        <label class="mc-label">Estado</label>
        <select class="mc-select" name="estado">
          <option value="disponible" {% if mesa.estado == "disponible" %}selected{% endif %}>Disponible</option>
          <option value="reservada"  {% if mesa.estado == "reservada"  %}selected{% endif %}>Reservada</option>
          <option value="ocupada"    {% if mesa.estado == "ocupada"    %}selected{% endif %}>Ocupada</option>
        </select>
      </div>
      <div class="mc-btn-row">
        <a href="{% url 'reserva_inicio' %}" class="mc-btn mc-btn-secondary">← Volver</a>
        <button type="submit" class="mc-btn mc-btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
