<div id="mc-crear" class="mc-section">
    <div class="mc-sec-header">
      <h2 id="mc-crear-titulo">Nueva reserva</h2>
      <p id="mc-crear-sub">Completa los datos para registrar la reserva</p>
    </div>
    <div class="mc-card">
      <div class="mc-card-title">Información del cliente</div>
      <div class="mc-form-row">
        <div class="mc-form-group">
          <label class="mc-label">Nombre completo *</label>
          <input type="text" class="mc-input" id="mc-c-nombre" placeholder="Ej: María García">
        </div>
        <div class="mc-form-group">
          <label class="mc-label">Teléfono * (10 dígitos)</label>
          <input type="tel" class="mc-input" id="mc-c-telefono" placeholder="3001234567" maxlength="10" pattern="[0-9]*" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>
      </div>
      <div class="mc-form-row">
        <div class="mc-form-group">
          <label class="mc-label">Correo electrónico</label>
          <input type="email" class="mc-input" id="mc-c-email" placeholder="correo@ejemplo.com">
        </div>
        <div class="mc-form-group">
          <label class="mc-label">N.° de personas *</label>
          <input type="number" class="mc-input" id="mc-c-personas" min="1" max="30" placeholder="2">
        </div>
      </div>
    </div>
    <div class="mc-card">
      <div class="mc-card-title">Detalles de la reserva</div>
      <div class="mc-form-row three">
        <div class="mc-form-group">
          <label class="mc-label">Fecha *</label>
          <input type="date" class="mc-input" id="mc-c-fecha" onchange="mcPoblarMesas()">
        </div>
        <div class="mc-form-group">
          <label class="mc-label">Hora *</label>
          <input type="time" class="mc-input" id="mc-c-hora" step="1800" onchange="mcPoblarMesas()">
        </div>
        <div class="mc-form-group">
          <label class="mc-label">Mesa *</label>
          <select class="mc-select" id="mc-c-mesa"><option value="">— Seleccionar mesa —</option></select>
        </div>
      </div>
      <div class="mc-form-row">
        <div class="mc-form-group">
          <label class="mc-label">Ocasión especial</label>
          <select class="mc-select" id="mc-c-ocasion">
            <option value="">Sin ocasión especial</option>
            <option>Cumpleaños</option><option>Aniversario</option>
            <option>Reunión de negocios</option><option>Cena romántica</option>
            <option>Celebración familiar</option><option>Graduación</option><option>Otra</option>
          </select>
        </div>
        <div class="mc-form-group">
          <label class="mc-label">Estado</label>
          <select class="mc-select" id="mc-c-estado">
            <option value="confirmada">Confirmada</option>
            <option value="pendiente">Pendiente</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
      </div>
      <div class="mc-form-group full">
        <label class="mc-label">Notas adicionales</label>
        <textarea class="mc-textarea" id="mc-c-notas" placeholder="Alergias, preferencias, solicitudes especiales..."></textarea>
      </div>
      <div class="mc-btn-row">
        <button class="mc-btn mc-btn-secondary" onclick="mcLimpiar();mcShow('reservas')">← Volver</button>
        <button class="mc-btn mc-btn-secondary" onclick="mcLimpiar()">Limpiar</button>
        <button class="mc-btn mc-btn-primary" onclick="mcGuardarReserva()" id="mc-btn-guardar">Guardar reserva</button>
      </div>
    </div>
  </div>
