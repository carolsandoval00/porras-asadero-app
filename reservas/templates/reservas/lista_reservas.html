<!-- ===== LISTA RESERVAS ===== -->
<div id="mc-reservas" class="mc-section active">
 <div class="mc-list-card">
  <div class="mc-list-header">
    <h3>Reservas</h3>
    <div class="mc-report-bar">
      <button class="pm-btn pm-btn-danger pm-btn-sm" onclick="mcExportarPDF()" data-tooltip="Descargar en PDF">⬇ PDF</button>
      <button class="pm-btn pm-btn-success pm-btn-sm" onclick="mcExportarExcel()" data-tooltip="Descargar en Excel">⬇ Excel</button>
      <button class="pm-btn pm-btn-info pm-btn-sm" onclick="mcImprimir()" data-tooltip="Imprimir esta lista">🖨 Imprimir</button>
      <button class="pm-btn pm-btn-accent pm-btn-sm" onclick="mcShow('crear')" data-tooltip="Hacer una reserva nueva">Nueva reserva</button>
    </div>
  </div>

  <div class="mc-list-body">
  <div class="mc-filter-bar">
    <input
      type="text"
      class="mc-input"
      id="mc-buscar"
      placeholder="Buscar por nombre o teléfono..."
      oninput="mcRenderTabla()"
      data-tooltip="Escribe para buscar"
    >



    <select
      class="mc-select"
      id="mc-filtro-fecha"
      onchange="mcToggleFiltroFecha()"
      data-tooltip="Filtra por fecha"
    >
      <option value="">Todas las fechas</option>
      <option value="hoy">Hoy</option>
      <option value="futuras">Próximas</option>
      <option value="pasadas">Pasadas</option>
      <option value="dia">Día específico</option>
      <option value="mes">Mes específico</option>
      <option value="rango">Rango de fechas</option>
    </select>

    <input
      type="date"
      class="mc-input"
      id="mc-filtro-fecha-dia"
      style="display:none;max-width:170px"
      onchange="mcRenderTabla()"
      data-tooltip="Elige el día"
    >

    <input
      type="month"
      class="mc-input"
      id="mc-filtro-fecha-mes"
      style="display:none;max-width:170px"
      onchange="mcRenderTabla()"
      data-tooltip="Elige el mes"
    >

    <div id="mc-filtro-rango" style="display:none;gap:6px;align-items:center">
      <label class="mc-label" for="mc-filtro-desde" style="margin:0">Desde</label>
      <input type="date" class="mc-input" id="mc-filtro-desde"
             style="max-width:160px" onchange="mcRenderTabla()">
      <label class="mc-label" for="mc-filtro-hasta" style="margin:0">Hasta</label>
      <input type="date" class="mc-input" id="mc-filtro-hasta"
             style="max-width:160px" onchange="mcRenderTabla()">
    </div>

    <button type="button" class="pm-btn pm-btn-primary pm-btn-sm" onclick="mcRenderTabla()" data-tooltip="Buscar con los filtros elegidos">Filtrar</button>
    <button class="pm-btn pm-btn-light pm-btn-sm" onclick="mcLimpiarFiltros()" title="Quitar todos los filtros">
      Limpiar
    </button>

    <span id="mc-contador-reservas" class="mc-list-count"></span>
  </div>

  <div class="mc-table-wrap">
      <table class="mc-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Mesa</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Personas</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="mc-tbody-reservas"></tbody>
      </table>
  </div>
  </div><!-- /.mc-list-body -->
 </div><!-- /.mc-list-card -->
</div>
