{% extends 'base2.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Recuperar Contraseña</h2>
    <p>Ingresa tu correo y te enviaremos instrucciones.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Recuperar contraseña
        </button>
    </form>
</div>
{% endblock %}
