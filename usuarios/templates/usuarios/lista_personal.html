{% extends "base2.html" %}
{% block content %}
<div class="container mt-5 p-4 shadow rounded bg-light">
    <h2>Lista de Personal</h2>
    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
            </tr>
        </thead>
        <tbody>
            {% for p in personal_list %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.usuario }}</td>
                <td>{{ p.rol }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No hay personal registrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
