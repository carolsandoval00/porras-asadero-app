{% extends 'base 2.html' %}

{% block content %}

<div style="max-width: 400px; margin: 80px auto; padding: 30px; border: 1px solid #ccc; border-radius: 10px; text-align: center;">

    <h2>Iniciar Sesión </h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Usuario" required
        style="width: 100%; padding: 10px; margin-top: 15px;"><br><br>

        <input type="password" name="password" placeholder="Contraseña" required
        style="width: 100%; padding: 10px;"><br><br>

        <button type="submit"
        style="width: 100%; padding: 10px; background-color: black; color: white; border: none;">
            Entrar
        </button>
    </form>

    
    {% if form.non_field_errors %}
        <p style="color:red; margin-top:15px;">
            Usuario o contraseña incorrectos 
        </p>
    {% endif %}

</div>

{% endblock %}
