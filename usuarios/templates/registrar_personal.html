{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h2>Registrar Personal</h2>

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label>Nombre</label>
            {{ form.nombre }}
        </div>

        <div class="mb-3">
            <label>Usuario</label>
            {{ form.usuario }}
        </div>

        <div class="mb-3">
            <label>Contraseña</label>
            {{ form.contraseña }}
        </div>

        <div class="mb-3">
            <label>Rol</label>
            {{ form.rol }}
        </div>

        <button class="btn btn-primary">Registrar</button>
    </form>
</div>

{% endblock %}
