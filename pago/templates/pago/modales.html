<!-- Modal éxito: pedido registrado -->
<div id="modal-pago-exito" class="pg-modal-overlay">
  <div class="pg-modal-box pg-success-box">
    <div class="pg-success-row">
      <span class="pg-success-icon">✓</span>
      <p id="modal-pago-exito-msg">Pedido registrado correctamente.</p>
    </div>
  </div>
</div>
<!-- Modal eliminar pago -->
<div id="modal-eliminar" class="pg-modal-overlay">
  <div class="pg-modal-box">
    <h4>Confirmar eliminación</h4>

    <p id="modal-msg">
      ¿Estás seguro de eliminar este registro?
    </p>

    <div class="pg-modal-actions">

      <form id="modal-form" method="post">
        {% csrf_token %}
        <button type="submit" class="pg-btn pg-btn-danger" data-tooltip="Esta acción no se puede deshacer">
          Sí, eliminar
        </button>
      </form>

      <button
        class="pg-btn pg-btn-light"
        data-tooltip="Cerrar sin eliminar"
        onclick="cerrarModal()">
        Cancelar
      </button>

    </div>
  </div>
</div>


<!-- Modal cerrar caja -->
<div id="modal-cerrar-caja" class="pg-modal-overlay">
  <div class="pg-modal-box">

    <h4> Cerrar caja</h4>

    <p id="modal-cierre-msg">
      ¿Confirmas el cierre de esta caja?
    </p>

    <p class="pg-modal-subtext">
      Se registrará la hora de cierre automáticamente.
    </p>

    <div class="pg-modal-actions">

      <form
        id="modal-cierre-form"
        method="post"
        action="{% url 'pago:dashboard' %}">

        {% csrf_token %}

        <input
          type="hidden"
          name="action"
          value="cerrar_caja">

        <input
          type="hidden"
          name="caja_id"
          id="modal-cierre-caja-id"
          value="">

        <button
          type="submit"
          class="pg-btn pg-btn-danger"
          data-tooltip="Esta acción no se puede deshacer">
          Sí, cerrar caja
        </button>

      </form>

      <button
        class="pg-btn pg-btn-light"
        data-tooltip="Cerrar sin confirmar"
        onclick="cerrarModalCierre()">
        Cancelar
      </button>

    </div>
  </div>
</div>


<!-- Modal editar caja -->
<div id="modal-editar-caja" class="pg-modal-overlay">
  <div class="pg-modal-box pg-modal-box-lg">

    <h4> Editar caja</h4>

    <p id="modal-editar-titulo" class="pg-modal-edit-title"></p>

    <!-- Mensajes -->
    <div id="editar-feedback" class="pg-modal-feedback"></div>

    <div class="pg-modal-field">

      <label>
        Observaciones

        <span class="pg-label-optional">
          (opcional)
        </span>

      </label>

      <textarea
        id="editar-observaciones"
        rows="3"
        placeholder="Observaciones de la caja…">
      </textarea>

    </div>

    <div class="pg-modal-actions pg-mt-2">

      <button
        id="btn-guardar-caja"
        class="pg-btn pg-btn-accent"
        data-tooltip="Guardar los cambios"
        onclick="guardarEditarCaja()">

         Guardar cambios

      </button>

      <button
        class="pg-btn pg-btn-light"
        data-tooltip="Cerrar sin guardar"
        onclick="cerrarEditarCaja()">

        Cancelar

      </button>

    </div>

  </div>
</div>
